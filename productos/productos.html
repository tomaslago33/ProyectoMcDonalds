<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos - McDonald's</title>
  <link rel="stylesheet" href="styleProductos.css">
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<style>
        body {
      margin: 0;
      font-family: 'Helvetica Neue', sans-serif;
      
    }

    .menu-btn {
      font-size: 2rem;
      background: none;
      border: none;
      cursor: pointer;
      margin: 1rem;
    }

    .side-menu {
      position: fixed;
      left: -100%;
      top: 0;
      width: 25%;
      height: 100%;
      background-color: white;
      box-shadow: 2px 0 10px rgba(0, 0, 0, 0.1);
      transition: left 0.3s ease;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      z-index: 1000;
      justify-content: flex-start;
    }

    .side-menu.open {
      left: 0;
    }

    .close-btn {
      font-size: 2rem;
      background: none;
      border: none;
      align-self: flex-start; /* alinea la cruz a la izquierda */
      cursor: pointer;
      margin-bottom: 1rem;
    }

    .menu-list {
      list-style: none;
      padding: 0;
      padding-left: 1rem;
      
    }

    .menu-list li {
      margin: 1rem 0;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding-bottom: 1.5rem;
      font-size: 0.9rem;
      font-weight: 400;
    }

    .menu-list a {
      text-decoration: none;
      color: black;
      font-size: 0.9rem;
    }

    .menu-list a:visited {
      color: black;
    }

    .menu-list img {
      width: 24px;
      height: 24px;
    }

    .dropdown {
      cursor: pointer;
      justify-content: space-between;
      display: flex;
    }

    .arrow {
      margin-left: auto;
      font-size: 0.8rem;
      color: #000;
      transition: transform 0.3s ease;
    }


    .download-section {
      margin-top: auto;
      padding-top: 2rem;
      padding-bottom: 2rem;
      padding-left: 0.8rem;
      text-align: left;
    }

    .download-section p {
      margin: 0 0 2rem;
      font-size: 1.4rem;
    }

    .store-buttons {
      display: flex;
      gap: 2rem;
    }

    .store-btn {
      background-color:  #fbfbfb ;
      border: none;
      border-radius: 12px;
      padding: 0.5rem;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      cursor: pointer;
      
    }
    .store-btn img {
      width: 80%;  
      height: 90%;
    }
   
    </style>
</head>
  
<body>
<nav class="side-menu" id="sideMenu">
    <button class="close-btn" id="closeMenu">&times;</button>
    <ul class="menu-list">
      <li><a href="../productos/productos.html"><img src="../Captura de pantalla 2025-05-23 214636.png" alt=""> Productos</a></li>
      <li><a href="../en_familia/enfamilia.html"><img src="../Frame_2010_a290bfee94.webp" alt=""> En familia</a></li>
      <li><a href="../quienessomos/quienes.html"><img src="../Open_Door_Tour_De_Nuestra_Cocina_9ae140a377.png" alt=""> Quienes Somos</a></li>

      <li class="dropdown"> <b><span>Sobre Nosotros</span></b> <i class="fas fa-chevron-down arrow"></i></li>
      <li class="dropdown"> <b><span>Descubre</span></b> <i class="fas fa-chevron-down arrow"></i></li>
      <li class="dropdown"> <b><span>Ayuda</span> </b><i class="fas fa-chevron-down arrow"></i></li>
    </ul>

    <div class="download-section">
      <p>Disfrutá de la<br><strong>mejor experiencia</strong></p>
      <div class="store-buttons">
        <button class="store-btn ios"><img src="../ios.png" alt="iOS"></button>
        <button class="store-btn android"><img src="../androi.png" alt="Android"></button>
      </div>
    </div>
    
  </nav>
   <header class="navbar">
    <div class="logo-container">
      <a href="../index/index.html">
      <button class="menu-btn" id="openMenu">&#9776;</button><img src="../imagenes/logo.png" alt="Logo de McDonald's" class="logo">
      </a>
      <nav class="menu-secundario">
      
        <ul>
          <li><a href="#">Productos</a></li>
          <li><a href="#">En familia</a></li>
          <li><a href="#">Receta del Futuro</a></li>
        </ul>
      </nav>
    </div>
    <a href="../login.html" class="btn btn-warning position-absolute top-0 end-0 m-4">Entrar</a>
    
  </header>

  <main class="productos">
    <div class="productos-inner">
      <div class="categoria">
      <img src="../imagenes/hamburguesas.png" alt="Hamburguesas">
      <p>Hamburguesas</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/sandpollo.png" alt="Sándwiches de Pollo">
      <p>Sándwiches de <br>Pollo</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/papas.png" alt="Papas y Complementos">
      <p>Papas y Complementos</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/bebidasl.png" alt="Bebidas">
      <p>Bebidas</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/postres.png" alt="Postres">
      <p>Postres</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/ensaladas.png" alt="Ensaladas">
      <p>Ensaladas</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/mccafe.png" alt="McCafé">
      <p>McCafé</p>
    </div>
    <div class="categoria">
      <img src="../imagenes/cfeliz.png" alt="Cajita Feliz" >
      <p>Cajita Feliz</p>
    </div>
    </div>
    
  </main>

</body>
</html>
