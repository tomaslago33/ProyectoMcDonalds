<!DOCTYPE html>
<html lang="es">
<head>

  <title>Productos - McDonald's</title>
  <link rel="stylesheet" href="styleProductos.css">
</head>
  
<body>

   <header class="navbar">
    <div class="logo-container">
      <a href="../index/index.html">
      <img src="../imagenes/logo.png" alt="Logo de McDonald's" class="logo">
      </a>
      <nav class="menu-secundario">
      
        <ul>
          <li><a href="#">Productos</a></li>
          <li><a href="#">En familia</a></li>
          <li><a href="#">Receta del Futuro</a></li>
        </ul>
      </nav>

    <a href="../login.html" class="btn btn-warning position-absolute top-0 end-0 m-4">Entrar</a>

  <main class="productos">
    <div class="productos-inner">

      <img src="../imagenes/sandpollo.png" alt="Sándwiches de Pollo">

    </div>

    </div>
    <div class="categoria">
      <img src="../imagenes/cfeliz.png" alt="Cajita Feliz" >
      <p>Cajita Feliz</p>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
